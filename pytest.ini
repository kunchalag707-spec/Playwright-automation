[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --headed --browser chromium --screenshot only-on-failure --video retain-on-failure
log_cli = true
log_cli_level = INFO
markers =
    smoke: quick sanity checks
    regression: full regression coverage
    login: login flow tests
    search: search flow tests
    checkout: checkout flow tests
