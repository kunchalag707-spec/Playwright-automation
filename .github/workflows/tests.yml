name: Playwright Pytest Tests

on:
  push:
    branches:
      - main

  
  pull_request:
    branches:
      - main


permissions:
  contents: read
  pages: write
  id-token: write
      

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TIMEOUT_MS: ${{ secrets.TIMEOUT_MS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version
    
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps


      - name: Verify environment variables
        run: |
          python -c "import os; print('BASE_URL:', os.getenv('BASE_URL')); print('APP_USERNAME SET:', bool(os.getenv('APP_USERNAME'))); print('APP_PASSWORD SET:', bool(os.getenv('APP_PASSWORD'))); print('API_BASE_URL SET:', bool(os.getenv('API_BASE_URL'))); print('TIMEOUT_MS:', os.getenv('TIMEOUT_MS'))"

      - name: Run UI and API tests
        run: |
          python -m pytest --alluredir=allure-results --clean-alluredir

      - name: Generate Allure report
        if: ${{ always() }}
        run: |
          if [ -d allure-results ] && [ -n "$(find allure-results -name '*-result.json' -print -quit)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo '<html><body><h1>No Allure test results found</h1></body></html>' > allure-report/index.html
            echo "No Allure result files were generated."
          fi

      - name: Upload Allure report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
         path: allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4    


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore   